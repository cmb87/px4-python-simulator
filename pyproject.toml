[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "px4-python-sitl"
version = "0.1.0"
description = "Python lockstep SITL bridge with 6DOF vehicle and MAVLink HIL streams"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "PX4 Python SITL Contributors"}
]
dependencies = [
  "numpy>=1.24",
  "pymavlink>=2.4.41",
  "websockets>=11.0"
]

[project.optional-dependencies]
rl = [
  "gymnasium>=0.29"
]
viz = [
  "matplotlib>=3.7"
]

[project.scripts]
px4-python-sitl = "main:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["main", "dummy_ground_truth_ws_publisher", "sim_utils"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["vehicles*", "visualizer*", "guidance*", "dynamics*", "sensors*", "networking*", "rl*", "perception*"]

[tool.setuptools.package-data]
"*" = ["*.csv", "*.dat"]
